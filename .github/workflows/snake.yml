name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.gif?palette=github-dark&color_snake=22d3ee&color_background=0d1117
            assets/snake-light.gif?palette=github-light&color_snake=c026d3&color_background=ffffff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh the contribution snake animation
          file_pattern: assets/snake-*.gif
